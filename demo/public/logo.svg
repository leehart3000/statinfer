  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- italic "s" -->
    <path d="M8.7 7.4c-.3-.8-1.2-1.1-2-1-1 .1-1.6.8-1.4 1.5.2.8 1.1 1.1 1.8 1.4.8.3 1.3.8 1.1 1.6-.2.8-1.1 1.3-2.1 1.2-.8-.1-1.4-.5-1.6-1.1" stroke-width="1.3"/>
    <!-- italic "i", with a curved entry at the top and a tail at the bottom -->
