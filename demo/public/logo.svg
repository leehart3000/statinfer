<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1d4ed8"/>
  <!-- shaded tails under the bell curve: the "extreme results" behind a p-value -->
