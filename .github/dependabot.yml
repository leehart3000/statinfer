version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      stdlib:
        patterns: ["@stdlib/*"]
      dev-tools:
        dependency-type: development
    ignore:
      # TypeDoc and typescript-eslint don't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node types matching the oldest supported Node version (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /scripts
    schedule:
      interval: weekly